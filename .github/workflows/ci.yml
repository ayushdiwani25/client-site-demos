name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Lint & Build (CI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client-sites

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client-sites/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          VITE_WHATSAPP_NO: ${{ secrets.VITE_WHATSAPP_NO }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: client-sites/dist
          retention-days: 7

  deploy:
    name: Deploy to Vercel (CD)
    needs: validate-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy status note
        run: |
          echo "CI validation passed successfully."
          echo "Production deployment is triggered for branch main."
